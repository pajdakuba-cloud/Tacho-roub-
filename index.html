<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TachoŠroub</title>
    <!-- Načtení knihovny Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --accent-color: #00ffcc;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Hlavička s názvem a tlačítky */
        .app-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .app-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .header-icons {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1rem;
        }

        /* Volič maximální rychlosti */
        .range-selector {
            margin-bottom: 15px;
            display: flex;
            gap: 5px;
            background: #1a1a1a;
            padding: 5px;
            border-radius: 10px;
            border: 1px solid #333;
            width: 100%;
            box-sizing: border-box;
        }

        .range-btn {
            background: #222;
            color: #aaa;
            border: none;
            padding: 8px 0;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            flex: 1;
            text-align: center;
            font-weight: bold;
            transition: 0.2s;
        }

        .range-btn.active {
            background: var(--accent-color);
            color: #000;
        }

        /* Tachometr */
        .gauge {
            position: relative;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #222222 0%, #0d0d0d 100%);
            border: 6px solid #333;
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 0, 0, 0.9);
            margin-bottom: 15px;
        }

        .gauge-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            height: 90px;
            background: #1a1a1a;
            border: 2px solid #444;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.6);
            z-index: 10;
        }

        .speed-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-color);
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .speed-unit {
            font-size: 0.65rem;
            color: #888;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        .needle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 3px;
            height: 70px;
            background: linear-gradient(to top, #ff3333, #ff6666);
            transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(-135deg);
            transition: transform 0.2s cubic-bezier(0.1, 1, 0.1, 1);
            border-radius: 2px 2px 0 0;
            z-index: 5;
            box-shadow: 0 0 5px rgba(255, 51, 51, 0.6);
        }

        .needle::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: #555;
            border: 2px solid #222;
            border-radius: 50%;
        }

        .scale-marks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .scale-mark {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 6px;
            background: #666;
            transform-origin: center 0px;
        }

        .scale-mark.major {
            width: 3px;
            height: 10px;
            background: #fff;
        }

        .scale-number {
            position: absolute;
            font-size: 0.6rem;
            color: #aaa;
            font-weight: bold;
            width: 28px;
            height: 15px;
            text-align: center;
            line-height: 15px;
        }

        /* Grafy pod sebou */
        .chart-container {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        /* Ovládací tlačítka */
        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 5px;
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.2);
            flex: 1;
            transition: background 0.2s;
        }

        .btn-save {
            background-color: #ff9900;
            box-shadow: 0 4px 15px rgba(255, 153, 0, 0.2);
            color: #000;
        }

        .btn-test {
            background-color: #9900ff;
            box-shadow: 0 4px 15px rgba(153, 0, 255, 0.2);
            color: #fff;
            margin-top: 5px;
            width: 100%;
            border-radius: 25px;
            border: none;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .status {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #777;
            text-align: center;
        }

        /* Modální okna */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #1a1a1a;
            border: 1px solid #444;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            width: 85%;
            max-width: 320px;
        }

        .modal-content h3 {
            margin-top: 0;
            color: var(--accent-color);
        }

        .close-modal {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 20px;
            margin-top: 15px;
            cursor: pointer;
            width: 100%;
        }

        .color-picker-wrapper {
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <!-- Hlavička -->
    <div class="app-header">
        <div class="app-title">TachoŠroub</div>
        <div class="header-icons">
            <button class="icon-btn" onclick="openModal('settingsModal')" title="Nastavení">⚙️</button>
            <button class="icon-btn" onclick="openModal('qrModal')" title="Podpořit účtem">☕</button>
        </div>
    </div>

    <!-- Volba rozsahu budíku -->
    <div class="range-selector" id="rangeSelector">
        <button class="range-btn" data-speed="60" onclick="setMaxSpeed(60)">60 km/h</button>
        <button class="range-btn" data-speed="120" onclick="setMaxSpeed(120)">120 km/h</button>
        <button class="range-btn active" data-speed="160" onclick="setMaxSpeed(160)">160 km/h</button>
        <button class="range-btn" data-speed="240" onclick="setMaxSpeed(240)">240 km/h</button>
    </div>

    <!-- Tachometr -->
    <div class="gauge">
        <div class="scale-marks" id="scaleMarks"></div>
        <div class="needle" id="needle"></div>
        <div class="gauge-center">
            <div class="speed-value" id="speedValue">0</div>
            <div class="speed-unit">km/h</div>
        </div>
    </div>

    <!-- Grafy -->
    <div class="chart-container"><canvas id="speedChart" height="85"></canvas></div>
    <div class="chart-container"><canvas id="altitudeChart" height="85"></canvas></div>
    <div class="chart-container"><canvas id="accelChart" height="85"></canvas></div>

    <!-- Ovládání -->
    <div class="btn-group">
        <button id="toggleBtn" class="btn">Spustit GPS</button>
        <button id="saveBtn" class="btn btn-save" disabled>Uložit (CSV)</button>
    </div>
    <!-- Testovací tlačítko -->
    <button id="testBtn" class="btn-test" onclick="toggleSimulation()">🧪 Test / Simulace jízdy</button>
    
    <div id="status" class="status">GPS čeká na spuštění...</div>
</div>

<!-- Modální okno: QR kód -->
<div id="qrModal" class="modal">
    <div class="modal-content">
        <h3>Podpořit TachoŠroub</h3>
        <p style="font-size: 0.8rem; color: #aaa; margin-bottom: 8px;">Naskenuj QR kód v libovolné české bankovní aplikaci:</p>
        
        <div style="background: #fff; padding: 8px; display: inline-block; border-radius: 8px; margin: 5px 0;">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=SPD*ACC:CZ9655000000005627209003*AM:50.00*CC:CZK*MSG:Podpora%20Tachosroub" alt="QR Platba Účet" style="display:block;">
        </div>
        <p style="font-size: 0.75rem; color: #ccc; margin: 5px 0 0 0;">Účet: 5627209003/5500</p>

        <button class="close-modal" onclick="closeModal('qrModal')">Zavřít</button>
    </div>
</div>

<!-- Modální okno: Nastavení barev -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <h3>Nastavení vzhledu</h3>
        <div class="color-picker-wrapper">
            <span style="font-size: 0.9rem;">Barva displeje:</span>
            <input type="color" id="colorPicker" value="#00ffcc" onchange="changeAccentColor(this.value)" style="background:none; border:none; width:40px; height:30px; cursor:pointer;">
        </div>
        <button class="close-modal" onclick="closeModal('settingsModal')">Uložit</button>
    </div>
</div>

<script>
let maxSpeed = 160;
const speedValueEl = document.getElementById('speedValue');
const needleEl = document.getElementById('needle');
const toggleBtn = document.getElementById('toggleBtn');
const saveBtn = document.getElementById('saveBtn');
const statusEl = document.getElementById('status');
const scaleMarksEl = document.getElementById('scaleMarks');

let watchID = null;
let isTracking = false;
let simulationInterval = null;
let isSimulating = false;
let lastSpeed = 0;
let lastTime = null;
let recordedData = [];

// --- GRAFY ---
const commonOptions = (color) => ({
    responsive: true,
    animation: false,
    plugins: { legend: { labels: { color: '#aaa', font: { size: 9 } } } },
    scales: {
        x: { ticks: { color: '#aaa', font: { size: 9 }, maxTicksLimit: 5, autoSkip: true }, grid: { color: '#222' } },
        y: { ticks: { color: color, font: { size: 9 } }, grid: { color: '#222' } }
    }
});

const speedChart = new Chart(document.getElementById('speedChart').getContext('2d'), {
    type: 'line',
    data: { labels: [], datasets: [{ label: 'Rychlost (km/h)', data: [], borderColor: '#00ffcc', backgroundColor: 'rgba(0,255,204,0.1)', borderWidth: 2, tension: 0.2, fill: true }] },
    options: commonOptions('#00ffcc')
});

const altitudeChart = new Chart(document.getElementById('altitudeChart').getContext('2d'), {
    type: 'line',
    data: { labels: [], datasets: [{ label: 'Výška (m n.m.)', data: [], borderColor: '#ff9900', borderWidth: 1.5, tension: 0.2 }] },
    options: commonOptions('#ff9900')
});

const accelChart = new Chart(document.getElementById('accelChart').getContext('2d'), {
    type: 'line',
    data: { labels: [], datasets: [{ label: 'Akcelerace (m/s²)', data: [], borderColor: '#ff3333', borderWidth: 1.5, tension: 0.2 }] },
    options: commonOptions('#ff3333')
});

// --- CIFERNÍK ---
function createScale() {
    scaleMarksEl.innerHTML = '';
    const totalAngle = 270;
    const startAngle = -225;
    const centerX = 110;
    const centerY = 110;
    const markRadius = 93;
    const numRadius = 72;
    
    let steps = 8;
    if (maxSpeed === 60) steps = 6;
    if (maxSpeed === 240) steps = 12;

    const stepVal = maxSpeed / steps;

    for (let i = 0; i <= steps; i++) {
        const speed = Math.round(i * stepVal);
        const fraction = speed / maxSpeed;
        const angle = startAngle + (fraction * totalAngle);
        
        const mark = document.createElement('div');
        mark.className = 'scale-mark major';
        mark.style.transform = `translate(-50%, -50%) rotate(${angle}deg) translateY(-${markRadius}px)`;
        scaleMarksEl.appendChild(mark);
        
        const num = document.createElement('div');
        num.className = 'scale-number';
        num.innerText = speed;
        
        const rad = (angle - 90) * (Math.PI / 180);
        const x = centerX + numRadius * Math.cos(rad) - 14;
        const y = centerY + numRadius * Math.sin(rad) - 8;
        
        num.style.left = `${x}px`;
        num.style.top = `${y}px`;
        scaleMarksEl.appendChild(num);
    }
}

function setMaxSpeed(newMax) {
    maxSpeed = newMax;
    document.querySelectorAll('.range-btn').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.getAttribute('data-speed')) === newMax);
    });
    speedChart.options.scales.y.max = maxSpeed;
    createScale();
}

// --- ZPRACOVÁNÍ DAT ---
function processData(speedMps, altitudeVal) {
    const currentTime = Date.now();
    const speedKmh = speedMps * 3.6;
    
    let accel = 0;
    if (lastTime !== null) {
        const timeDiff = (currentTime - lastTime) / 1000;
        if (timeDiff > 0) {
            accel = (speedMps - lastSpeed) / timeDiff;
        }
    }
    lastSpeed = speedMps;
    lastTime = currentTime;

    recordedData.push({
        time: new Date(currentTime).toISOString(),
        speedKmh: speedKmh.toFixed(1),
        altitude: altitudeVal.toFixed(1),
        accel: accel.toFixed(2)
    });
    saveBtn.disabled = false;

    let displaySpeed = speedKmh > maxSpeed ? maxSpeed : speedKmh;
    speedValueEl.innerText = Math.round(displaySpeed);
    const needleAngle = -225 + ((displaySpeed / maxSpeed) * 270);
    needleEl.style.transform = `translate(-50%, -100%) rotate(${needleAngle}deg)`;

    const timeString = new Date(currentTime).toLocaleTimeString();
    const pushData = (chart, val) => {
        chart.data.labels.push(timeString);
        chart.data.datasets[0].data.push(val);
        if (chart.data.labels.length > 20) {
            chart.data.labels.shift();
            chart.data.datasets[0].data.shift();
        }
        chart.update();
    };

    pushData(speedChart, speedKmh);
    pushData(altitudeChart, altitudeVal);
    pushData(accelChart, accel);
}

// --- SIMULACE ---
function toggleSimulation() {
    isSimulating = !isSimulating;
    const testBtn = document.getElementById('testBtn');
    if (isSimulating) {
        if (isTracking) stopGPS();
        testBtn.innerText = "🛑 Zastavit simulaci";
        testBtn.style.backgroundColor = "#ff3333";
        statusEl.innerText = "Běží testovací simulace...";
        recordedData = [];
        let simSpeed = 10;
        let simAlt = 300;
        simulationInterval = setInterval(() => {
            simSpeed += (Math.random() * 10 - 4);
            if (simSpeed < 0) simSpeed = 0;
            if (simSpeed > maxSpeed) simSpeed = maxSpeed;
            simAlt += (Math.random() * 2 - 1);
            processData(simSpeed / 3.6, simAlt);
        }, 1000);
    } else {
        testBtn.innerText = "🧪 Test / Simulace jízdy";
        testBtn.style.backgroundColor = "#9900ff";
        statusEl.innerText = "Simulace zastavena.";
        clearInterval(simulationInterval);
        speedValueEl.innerText = "0";
        needleEl.style.transform = `translate(-50%, -100%) rotate(-225deg)`;
    }
}

// --- MODÁLNÍ OKNA ---
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function changeAccentColor(color) {
    document.documentElement.style.setProperty('--accent-color', color);
    speedChart.data.datasets[0].borderColor = color;
    speedChart.data.datasets[0].backgroundColor = color + '22';
    speedChart.update();
}

// --- EXPORT CSV ---
saveBtn.addEventListener('click', () => {
    if (recordedData.length === 0) return;
    let csvContent = "data:text/csv;charset=utf-8,Cas,Rychlost (km/h),Vyska (m),Akcelerace (m/s2)\n";
    recordedData.forEach(row => {
        csvContent += `${row.time},${row.speedKmh},${row.altitude},${row.accel}\n`;
    });
    const link = document.createElement("a");
    link.setAttribute("href", encodeURI(csvContent));
    link.setAttribute("download", "tachosroub_zaznam.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
});

// --- ZASTAVENÍ GPS ---
function stopGPS() {
    if (watchID !== null) {
        navigator.geolocation.clearWatch(watchID);
        watchID = null;
    }
    isTracking = false;
    toggleBtn.innerText = "Spustit GPS";
    toggleBtn.style.backgroundColor = "var(--accent-color)";
    toggleBtn.style.color = "#000";
    speedValueEl.innerText = "0";
    needleEl.style.transform = `translate(-50%, -100%) rotate(-225deg)`;
}

// --- SPUŠTĚNÍ GPS ---
toggleBtn.addEventListener('click', () => {
    if (isSimulating) toggleSimulation();

    if (!isTracking) {
        if ('geolocation' in navigator) {
            statusEl.innerText = "Žádám o přístup k poloze...";
            
            const options = { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 };
            
            watchID = navigator.geolocation.watchPosition(
                (pos) => {
                    statusEl.innerText = "GPS signál OK (Sleduji pohyb)";
                    toggleBtn.innerText = "Zastavit GPS";
                    toggleBtn.style.backgroundColor = "#ff3333";
                    toggleBtn.style.color = "#fff";
                    isTracking = true;
                    
                    const speed = (pos.coords.speed !== null && pos.coords.speed >= 0) ? pos.coords.speed : 0;
                    const alt = pos.coords.altitude !== null ? pos.coords.altitude : 0;
                    processData(speed, alt);
                },
                (err) => { 
                    // Přesnější výpis chyb pro Android
                    let errorMsg = err.message;
                    if (err.code === 1) {
                        errorMsg = "Zamítnuto! Povol polohu v nastavení telefonu.";
                    } else if (err.code === 2) {
                        errorMsg = "GPS nedostupná (vyjdi ven).";
                    } else if (err.code === 3) {
                        errorMsg = "Vypršel čas GPS (čeká se na satelity).";
                    }
                    statusEl.innerText = "Chyba: " + errorMsg;
                    stopGPS();
                },
                options
            );
        } else {
            statusEl.innerText = "Geolokace není podporována.";
        }
    } else {
        stopGPS();
        statusEl.innerText = "GPS zastavena.";
    }
});

createScale();
</script>

</body>
</html>
